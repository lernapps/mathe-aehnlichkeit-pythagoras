# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Zentrische Streckung
description: Eine Figur vom Streckzentrum aus vergrößern oder verkleinern und sehen, was dabei gleich bleibt.
competencies: [aehnlichkeit]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Wenn ein Foto größer wird oder dein Schatten an der Wand wächst, fragst du: Was bleibt gleich, und wie hängen die Längen zusammen? Die zentrische Streckung beantwortet das. Du lernst, wie eine Figur von einem Punkt aus vergrößert oder verkleinert wird. Du erkennst, was dabei gleich bleibt und was sich ändert, und kannst aus zwei Längen den Streckfaktor bestimmen.
      - type: text
        text: |
          Mira hält ein Pappdreieck vor eine kleine Lampe. An der Wand erscheint der Schatten: ein größeres Dreieck mit derselben Form.
      - type: single-choice
        id: schatten-gleich
        text: Was ist im Pappdreieck und in seinem Schatten gleich?
        options:
          - text: die Winkel
            correct: true
            info: Der Schatten hat dieselbe Form wie die Pappe. Die Ecken sind gleich spitz oder stumpf.
          - text: die Seitenlängen
            correct: false
            info: Der Schatten ist größer, also sind seine Seiten länger als die der Pappe.
          - text: der Umfang
            correct: false
            info: Wenn alle Seiten länger sind, ist auch der Umfang größer.
        explanation: Schatten und Pappe haben dieselbe Form. Die Winkel bleiben gleich, die Längen ändern sich.
  - type: section
    id: idee
    title: So wird gestreckt
    blocks:
      - type: text
        text: |
          Wenn du genau beschreiben willst, wie eine Figur von einem Punkt aus größer oder kleiner wird, brauchst du diesen Punkt und eine Zahl. Die Lampe ist das **Streckzentrum** Z. Von Z aus geht ein Strahl (eine Linie, die in Z beginnt und unbegrenzt weiterläuft) durch jede Ecke der Pappe. Der Schatten dieser Ecke liegt auf demselben Strahl, weiter weg von Z. Ist der Schatten einer Ecke doppelt so weit von Z entfernt wie die Ecke selbst, gilt das für jede Ecke. Diese Zahl, hier 2, heißt **Streckfaktor** *k*: Bild-Abstand zu Z durch Original-Abstand zu Z.
      - type: definition
        term: Zentrische Streckung
        explanation: Jedem Punkt $P$ wird ein Bildpunkt $P'$ auf dem Strahl von $Z$ durch $P$ zugeordnet. Seine Entfernung von $Z$ ist das $k$-Fache der Entfernung von $P$.
      - type: definition
        term: Streckfaktor
        explanation: Die Zahl $k$, mit der alle Abstände zum Streckzentrum multipliziert werden. Bei $k > 1$ wird die Figur größer, bei $k < 1$ kleiner. Bei $k = 1$ liegt das Bild genau auf dem Original.
      - type: text
        text: |
          Das Bild unten zeigt ein Dreieck ABC mit dem rechten Winkel bei A (durchgezogen) und sein Bild A′B′C′ (gestrichelt). Die grauen Linien verbinden Z mit den Ecken des Bildes. Mit dem Regler stellst du den Streckfaktor *k* ein (0,5 bis 2,5). Die Tabelle zeigt den Abstand von Z zu A, drei Seitenlängen und den Winkel bei A, jeweils vorher und nachher. Beobachte, was sich ändert und was nicht.
      - type: vue-component
        id: streckung-bild
        component: Streckung
        props: {}
        nojs: |
          Dreieck ABC mit dem rechten Winkel bei A, AB = 3 cm, AC = 4 cm, BC = 5 cm, wird von Z aus gestreckt.
          Der Abstand von Z zu A ist 5 cm.
          Bei k = 0,5 sind der Abstand und die Seiten 2,5 cm, 1,5 cm, 2 cm und 2,5 cm. Bei k = 1 bleibt alles gleich.
          Bei k = 2 sind sie 10 cm, 6 cm, 8 cm und 10 cm. Der Winkel bei A misst in jedem Fall 90°.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Bei einer zentrischen Streckung mit dem Faktor *k* bleiben alle Winkel gleich. Jede Länge wird mit *k* multipliziert, nicht um *k* verlängert: Bei $k = 2$ wird aus 3 cm die Länge 6 cm, nicht 5 cm.
  - type: section
    id: beispiel
    title: Den Streckfaktor bestimmen
    blocks:
      - type: example
        title: Aus zwei Längen den Faktor berechnen
        blocks:
          - type: text
            text: |
              Wenn Original und Bild gegeben sind und du wissen willst, wie stark gestreckt wurde, bestimmst du den Faktor. Eine Strecke AB ist 3 cm lang, ihr Bild A′B′ ist 7,5 cm lang. Der Faktor ist Bildlänge durch Originallänge.
          - type: formula
            formula: 'k = \frac{7{,}5}{3} = 2{,}5'
          - type: text
            text: |
              Probe: Rechne mit dem Ergebnis zurück. Mit *k* = 2,5 wird 3 cm zu 2,5 · 3 cm = 7,5 cm. Das stimmt.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: winkel-streckung
        text: Ein Dreieck wird mit $k = 2$ gestreckt. Was ist richtig?
        options:
          - text: Auch die Winkel werden doppelt so groß.
            correct: false
            info: Aus einem 40°-Winkel würde 80°, die Form wäre eine andere. Beim Strecken bleibt die Form gleich, also bleiben die Winkel gleich.
          - text: Die Winkel bleiben gleich, die Längen werden doppelt so groß.
            correct: true
            info: Das ist die Eigenschaft der zentrischen Streckung. Winkel ändern sich nicht, Längen werden mit $k$ multipliziert.
          - text: Jede Länge wird um 2 cm größer.
            correct: false
            info: Das wäre Addieren. Beim Strecken wird mit dem Faktor multipliziert, aus 3 cm werden 6 cm, nicht 5 cm.
        explanation: Die Winkel bleiben bei jeder zentrischen Streckung gleich. Nur die Längen ändern sich, und zwar mit dem Faktor $k$.
      - type: generated
        id: bildlaenge
        given:
          k: { oneOf: [0.5, 1.5, 2, 2.5, 3] }
          a: { int: [2, 12] }
        where: ["decimals(a * k) <= 1", "a + k != a * k"]
        task:
          text: "Ein Dreieck wird vom Zentrum Z aus mit dem Faktor k = {{k}} gestreckt. Die Seite AB ist {{a}} cm lang. Wie lang ist die Seite A′B′ des Bildes?"
        answer: { value: "a * k", compare: { number: { format: decimal, decimals: 1, unit: cm } } }
        mistakes:
          - { value: "a + k", message: "Du hast {{k}} addiert. Beim Strecken wird mit dem Faktor multipliziert." }
          - { value: "a / k", message: "Du hast geteilt. Bei k = {{k}} wird die Länge mit {{k}} multipliziert." }
        hint: "Das Bild ist k-mal so lang wie das Original: Länge mal k."
        steps:
          - '$A'' B'' = k \cdot AB = {{k}} \cdot {{a}} = {{answer}}$, also {{answer}} cm.'
      - type: generated
        id: faktor-bestimmen
        given:
          a: { int: [2, 10] }
          b: { int: [1, 30] }
        where: ["b != a", "decimals(b / a) <= 1", "b / a <= 4", "b - a != b / a"]
        task:
          text: "Die Strecke AB ist {{a}} cm lang, ihr Bild A′B′ ist {{b}} cm lang. Bestimme den Streckfaktor k."
        answer: { value: "b / a", compare: { number: { format: decimal, decimals: 1 } } }
        mistakes:
          - {
              value: "round(a / b, 1)",
              message: "Du hast das Original durch das Bild geteilt. Der Faktor ist Bildlänge durch Originallänge.",
            }
          - {
              value: "b - a",
              message: "Du hast die Längen subtrahiert. Der Faktor ist ein Verhältnis: Bildlänge durch Originallänge.",
            }
        hint: "Teile die Länge des Bildes durch die Länge des Originals."
        steps:
          - '$k = \frac{A''B''}{AB} = \frac{{{b}}}{{{a}}} = {{answer}}$'
      - type: generated
        id: abstand-streckung
        given:
          zp: { int: [2, 10] }
          zq: { int: [3, 30] }
          a: { int: [2, 10] }
        where:
          [
            "zq != zp",
            "decimals(zq / zp) <= 1",
            "zq / zp <= 4",
            "decimals(a * zq / zp) <= 1",
            "a + zq - zp != a * zq / zp",
            "zq / zp != a",
            "a * zp / zq != a * zq / zp",
          ]
        task:
          text: "Beim Strecken vom Zentrum Z aus liegt der Punkt P {{zp}} cm von Z entfernt, sein Bildpunkt P′ liegt {{zq}} cm von Z entfernt. Eine Strecke ist {{a}} cm lang. Wie lang ist ihr Bild?"
        answer: { value: "a * zq / zp", compare: { number: { format: decimal, decimals: 1, unit: cm } } }
        mistakes:
          - {
              value: "zq / zp",
              message: "Das ist der Streckfaktor, noch nicht die Länge. Multipliziere ihn mit {{a}} cm.",
            }
          - {
              value: "a * zp / zq",
              message: "Du hast den Faktor umgedreht. Er ist Bild-Abstand durch Original-Abstand, die Strecke wird mit diesem Faktor multipliziert.",
            }
          - {
              value: "a + zq - zp",
              message: "Du hast die Differenz der Abstände addiert. Gestreckt wird mit einem Faktor, nicht durch Dazuzählen.",
            }
        hint: "Bestimme zuerst den Faktor k aus den Abständen zu Z: Bild-Abstand durch Original-Abstand. Dann multiplizierst du die Länge mit k."
        steps:
          - '$k = \frac{{{zq}}}{{{zp}}}$, dann $k \cdot {{a}} = {{answer}}$, also {{answer}} cm.'
      - type: generated
        id: winkel-schatten
        given:
          w: { int: [30, 80], step: 5 }
          k: { oneOf: [1.5, 2, 2.5, 3] }
        task:
          text: "Ein Pappdreieck hat bei einer Ecke einen Winkel von {{w}}°. Sein Schatten an der Wand ist {{k}}-mal so groß wie die Pappe. Wie groß ist der Winkel an der entsprechenden Ecke des Schattens? Gib die Zahl in Grad an."
        answer: { value: "w", compare: { number: { format: integer } } }
        mistakes:
          - {
              value: "w * k",
              message: "Der Faktor {{k}} gilt für Längen, nicht für Winkel. Die Form bleibt gleich, also bleibt der Winkel gleich.",
            }
        hint: "Überlege: Was bleibt beim Strecken gleich, die Längen oder die Winkel?"
        steps:
          - "Winkel bleiben beim Strecken gleich: {{answer}}°."
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: |
          Das kannst du jetzt: Winkel bleiben gleich. Längen werden mit *k* multipliziert. Der Faktor ist Bildlänge durch Originallänge. Auf der nächsten Seite fragst du, wann zwei Figuren ähnlich sind und was mit den Flächen passiert.

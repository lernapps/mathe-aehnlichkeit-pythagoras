# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für dieses Kapitel
description: Kongruenz, proportionale Zuordnungen, Maßstab, lineare Gleichungen und Winkelsumme kurz wiederholt, mit Kurztest.
recap:
  - mathematik/kongruenz
  - mathematik/proportionale-zuordnungen
  - mathematik/massstab
  - mathematik/lineare-gleichungen
blocks:
  - type: text
    text: |
      Dieses Kapitel baut auf vier Bausteinen auf, die du schon kennst: Kongruenz, proportionale Zuordnungen, Maßstab und lineare Gleichungen. Dazu kommt, wie du Winkel misst und was in einem Dreieck für die Winkel gilt. Lies jeden Abschnitt und mach den Kurztest. Er zählt nichts und speichert nichts, er zeigt dir nur, ob du bereit bist.
  - type: section
    id: kongruenz
    title: Kongruenz
    blocks:
      - type: text
        text: |
          Zwei Figuren sind **kongruent** (deckungsgleich), wenn man sie durch Verschieben, Drehen und Spiegeln genau aufeinanderlegen kann. Dann stimmen alle Längen und alle Winkel überein. Bei Dreiecken reichen drei passende Angaben, um das zu begründen. Ein **Kongruenzsatz** sagt, welche das sind.
      - type: definition
        term: Kongruenzsatz SSS
        explanation: Stimmen zwei Dreiecke in allen drei Seitenlängen überein, sind sie kongruent. Die Reihenfolge, in der die Seiten genannt werden, ist egal.
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: |
              Ein Dreieck hat die Seiten 3 cm, 4 cm und 5 cm, ein zweites 5 cm, 3 cm und 4 cm. Alle drei Längen kommen in beiden vor, also sind die Dreiecke nach SSS kongruent.
      - type: vue-component
        id: test-kongruenz
        component: Kurztest
        props:
          question: Dreieck 1 hat die Seiten 5 cm, 6 cm und 7 cm. Dreieck 2 hat die Seiten 7 cm, 5 cm und 6 cm. Was gilt?
          options:
            - {
                text: "Die Dreiecke sind nicht kongruent, weil die Reihenfolge der Seiten anders ist.",
                correct: false,
                info: "Die Reihenfolge, in der du die Seiten nennst, ändert das Dreieck nicht. Du kannst es drehen.",
              }
            - {
                text: "Die Dreiecke sind kongruent.",
                correct: true,
                info: "Alle drei Seitenlängen stimmen überein, nach SSS reicht das. Auf die Reihenfolge der Angaben kommt es nicht an.",
              }
            - {
                text: "Das lässt sich nur mit den Winkeln entscheiden.",
                correct: false,
                info: "Der Satz SSS braucht keine Winkel: Drei gleiche Seitenlängen legen das Dreieck fest.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Dreieck 1 hat die Seiten 5 cm, 6 cm und 7 cm, Dreieck 2 hat 7 cm, 5 cm und 6 cm. Antwort: Die Dreiecke sind kongruent. Alle drei Seitenlängen stimmen überein, das reicht nach SSS. Die Reihenfolge ist egal.
      - type: vue-component
        id: test-kongruenz-sws
        component: Kurztest
        props:
          question: Dreieck 1 hat die Seiten 4 cm und 6 cm, dazwischen den Winkel 50°. Dreieck 2 hat auch die Seiten 4 cm und 6 cm und einen Winkel von 50°, der aber nicht zwischen den beiden Seiten liegt, sondern der 6 cm langen Seite gegenüber. Was gilt?
          options:
            - text: Die Dreiecke sind kongruent nach SWS.
              correct: false
              info: SWS verlangt den Winkel zwischen den beiden Seiten. Hier liegt der 50°-Winkel nicht dazwischen.
            - text: Die Dreiecke sind kongruent, weil zwei Seiten und ein Winkel übereinstimmen.
              correct: false
              info: Zwei Seiten und irgendein Winkel reichen nicht. Entscheidend ist, wo der Winkel liegt.
            - text: Die Dreiecke sind nicht automatisch kongruent.
              correct: true
              info: Der Satz SWS gilt nur, wenn der Winkel zwischen den beiden Seiten liegt. Liegt er woanders, können die Dreiecke verschieden sein.
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Dreieck 1 hat die Seiten 4 cm und 6 cm mit dem Winkel 50° dazwischen, Dreieck 2 hat die Seiten 4 cm und 6 cm und einen Winkel 50°, der nicht zwischen ihnen liegt. Antwort: nicht automatisch kongruent, denn SWS verlangt den eingeschlossenen Winkel.
      - type: text
        text: |
          Warst du unsicher oder war deine Antwort falsch? Dann schau dir den Baustein „Kongruenz“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/kongruenz/) an.
  - type: section
    id: winkel
    title: Winkel messen und Winkelsumme
    blocks:
      - type: text
        text: |
          Mit dem Geodreieck misst du einen Winkel: Lege den Nullpunkt auf den Scheitel, einen Schenkel auf die Nulllinie und lies am anderen Schenkel ab. Ein Winkel zwischen 0° und 90° heißt spitz, bei genau 90° rechter Winkel, zwischen 90° und 180° stumpf.
      - type: definition
        term: Winkelsumme im Dreieck
        explanation: In jedem Dreieck sind die drei Innenwinkel zusammen 180°. Sind zwei Winkel bekannt, ist der dritte 180° minus ihre Summe.
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: |
              In einem Dreieck sind zwei Winkel 50° und 60° groß. Der dritte ist 180° − (50° + 60°) = 70°.
      - type: vue-component
        id: test-winkelsumme
        component: Kurztest
        props:
          question: In einem Dreieck sind zwei Winkel 48° und 67° groß. Wie groß ist der dritte Winkel?
          options:
            - { text: "65°", correct: true, info: "48° + 67° = 115°, und 180° − 115° = 65°." }
            - {
                text: "115°",
                correct: false,
                info: "Das ist die Summe der beiden bekannten Winkel. Der dritte Winkel ergänzt sie auf 180°.",
              }
            - { text: "245°", correct: false, info: "Du hast von 360° abgezogen. Im Dreieck sind es 180°." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: In einem Dreieck sind zwei Winkel 48° und 67° groß. Antwort: Der dritte Winkel ist 65°, denn 48° + 67° = 115° und 180° − 115° = 65°.
      - type: vue-component
        id: test-winkelart
        component: Kurztest
        props:
          question: Ein Winkel misst 123°. Wie heißt er?
          options:
            - text: spitz
              correct: false
              info: Spitz heißt kleiner als 90°. Ein Winkel von 123° ist größer als ein rechter Winkel.
            - text: stumpf
              correct: true
              info: Ein Winkel zwischen 90° und 180° heißt stumpf, 123° liegt dazwischen.
            - text: gestreckt
              correct: false
              info: Gestreckt ist ein Winkel von genau 180°, er bildet eine gerade Linie.
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Winkel misst 123°. Antwort: stumpf, denn er liegt zwischen 90° und 180°. Spitz wäre kleiner als 90°, gestreckt genau 180°.
  - type: section
    id: proportional
    title: Proportionale Zuordnungen
    blocks:
      - type: text
        text: |
          Eine Zuordnung ist **proportional**, wenn das Doppelte der einen Größe zum Doppelten der anderen gehört, das Dreifache zum Dreifachen und so weiter. Teilst du die eine Größe durch die andere, kommt immer dieselbe Zahl heraus. Diese Zahl heißt **Proportionalitätsfaktor**.
      - type: definition
        term: Proportionalitätsfaktor
        explanation: Die feste Zahl, mit der du die eine Größe multiplizierst, um die andere zu bekommen. Kosten 4 Hefte 6 €, ist der Faktor 1,50 € je Heft.
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: |
              3 kg Äpfel kosten 4,50 €. Der Faktor ist 4,50 € : 3 = 1,50 € je kg. 7 kg kosten dann 7 · 1,50 € = 10,50 €.
      - type: vue-component
        id: test-proportional
        component: Kurztest
        props:
          question: 5 Brötchen kosten 3,50 €. Was kosten 8 Brötchen?
          options:
            - {
                text: "6,50 €",
                correct: false,
                info: "Du hast 3 € addiert, weil es 3 Brötchen mehr sind. Bei proportionalen Zuordnungen wird multipliziert, nicht addiert.",
              }
            - {
                text: "2,19 €",
                correct: false,
                info: "Du hast mit dem Verhältnis 5 zu 8 statt 8 zu 5 gerechnet. Mehr Brötchen kosten mehr, nicht weniger.",
              }
            - {
                text: "5,60 €",
                correct: true,
                info: "Ein Brötchen kostet 3,50 € : 5 = 0,70 €. Für 8 Brötchen rechnest du 8 · 0,70 € = 5,60 €.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: 5 Brötchen kosten 3,50 €. Was kosten 8 Brötchen? Antwort: 5,60 €. Ein Brötchen kostet 3,50 € : 5 = 0,70 €, und 8 · 0,70 € = 5,60 €. Addieren (6,50 €) ist falsch, weil die Zuordnung proportional ist.
      - type: vue-component
        id: test-proportional-erkennen
        component: Kurztest
        props:
          question: Welche Zuordnung ist proportional?
          options:
            - text: Seitenlänge eines Quadrats zu seinem Umfang
              correct: true
              info: Doppelte Seitenlänge, doppelter Umfang. Der Faktor ist immer 4.
            - text: Seitenlänge eines Quadrats zu seinem Flächeninhalt
              correct: false
              info: Doppelte Seitenlänge ergibt die vierfache Fläche, nicht die doppelte. Das ist nicht proportional.
            - text: Alter eines Kindes zu seiner Körpergröße
              correct: false
              info: Mit doppeltem Alter ist ein Kind nicht doppelt so groß. Die Zuordnung ist nicht proportional.
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welche Zuordnung ist proportional? Antwort: Seitenlänge eines Quadrats zu seinem Umfang, denn doppelte Seite ergibt doppelten Umfang, der Faktor ist 4. Seitenlänge zu Fläche ist nicht proportional (doppelte Seite, vierfache Fläche), Alter zu Körpergröße auch nicht.
      - type: text
        text: |
          Warst du unsicher oder war deine Antwort falsch? Dann schau dir den Baustein „Proportionale Zuordnungen“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/proportionale-zuordnungen/) an.
  - type: section
    id: massstab
    title: Maßstab
    blocks:
      - type: text
        text: |
          Der **Maßstab** sagt, um welchen Faktor eine Zeichnung gegenüber der Wirklichkeit verkleinert (oder vergrößert) ist. Bei 1 : 500 ist 1 cm auf dem Plan 500 cm in Wirklichkeit.
      - type: definition
        term: Maßstab
        explanation: "Das Verhältnis von Länge in der Zeichnung zu Länge in der Wirklichkeit, geschrieben 1 : 500. Eine Länge im Plan wird mit 500 multipliziert, um die wirkliche Länge zu erhalten."
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: |
              Eine Strecke ist auf dem Plan 3 cm lang, der Maßstab ist 1 : 500. Wirklich sind das 3 cm · 500 = 1500 cm, also 15 m.
      - type: vue-component
        id: test-massstab
        component: Kurztest
        props:
          question: "Auf einer Karte im Maßstab 1 : 25 000 ist ein Weg 4,5 cm lang. Wie lang ist er in Wirklichkeit?"
          options:
            - {
                text: "112,5 m",
                correct: false,
                info: "112 500 cm sind 1125 m, nicht 112,5 m: Du hast beim Umrechnen eine Stelle verschoben (100 cm sind 1 m).",
              }
            - { text: "1,125 km", correct: true, info: "4,5 cm · 25 000 = 112 500 cm. Das sind 1125 m, also 1,125 km." }
            - {
                text: "11,25 km",
                correct: false,
                info: "112 500 cm sind 1,125 km. Du hast eine Stelle zu viel verschoben (100 000 cm sind 1 km).",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Auf einer Karte im Maßstab 1 : 25 000 ist ein Weg 4,5 cm lang. Antwort: 1,125 km. 4,5 cm · 25 000 = 112 500 cm = 1125 m = 1,125 km.
      - type: text
        text: |
          Warst du unsicher oder war deine Antwort falsch? Dann schau dir den Baustein „Maßstab“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/massstab/) an.
  - type: section
    id: gleichungen
    title: Lineare Gleichungen
    blocks:
      - type: text
        text: |
          Bei einer **linearen Gleichung** kommt die gesuchte Zahl *x* nur einfach vor, nie als *x*² oder *x* · *x*. Du löst sie mit **Äquivalenzumformungen**: Du tust auf beiden Seiten dasselbe, bis *x* allein steht. Ein Strich wie | · 6 am Zeilenende heißt: beide Seiten werden mit 6 multipliziert. So löst du auch eine Gleichung aus zwei gleichen Verhältnissen. *x* : 6 ist dasselbe wie der Bruch *x* über 6, und mit 6 multipliziert steht *x* allein.
      - type: definition
        term: Äquivalenzumformung
        explanation: Eine Umformung, die beide Seiten einer Gleichung gleich verändert (dieselbe Zahl addieren, subtrahieren, mit ihr multiplizieren oder durch sie teilen), ohne die Lösung zu ändern.
      - type: example
        title: Beispiel
        blocks:
          - type: text
            text: |
              Löse $3x + 5 = 20$. Erst auf beiden Seiten 5 subtrahieren: $3x = 15$. Dann durch 3 teilen: $x = 5$.
          - type: formula
            formula: '\frac{x}{6} = \frac{10}{4} \quad | \cdot 6 \quad \Rightarrow \quad x = \frac{10 \cdot 6}{4} = 15'
      - type: vue-component
        id: test-gleichung
        component: Kurztest
        props:
          question: Löse die Gleichung 4x − 7 = 2x + 9. Welches x ist richtig?
          options:
            - {
                text: "x = 1",
                correct: false,
                info: "Du hast 9 − 7 = 2 gerechnet. Die 7 steht links mit Minus: Beim Wechsel auf die rechte Seite wird sie addiert, also 9 + 7 = 16.",
              }
            - { text: "x = 16", correct: false, info: "Du bist bei 2x = 16 stehen geblieben. Noch durch 2 teilen." }
            - {
                text: "x = 8",
                correct: true,
                info: "Subtrahiere 2x und addiere 7: 2x = 16. Dann durch 2: x = 8. Probe: 4 · 8 − 7 = 25 und 2 · 8 + 9 = 25.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Löse 4x − 7 = 2x + 9. Antwort: x = 8. Erst 2x subtrahieren und 7 addieren: 2x = 16, dann durch 2 teilen. Probe: 4 · 8 − 7 = 25 und 2 · 8 + 9 = 25.
      - type: vue-component
        id: test-verhaeltnis
        component: Kurztest
        props:
          question: "Für welches x gilt x : 6 = 10 : 4?"
          options:
            - {
                text: "x = 15",
                correct: true,
                info: "Beide Seiten mit 6 multiplizieren: x = 10 · 6 : 4 = 60 : 4 = 15.",
              }
            - {
                text: "x = 2,4",
                correct: false,
                info: "Du hast 6 · 4 : 10 gerechnet. Das wäre die Lösung von x : 4 = 6 : 10. Hier steht x über der 6, also mit 6 multiplizieren.",
              }
            - {
                text: "x = 12",
                correct: false,
                info: "Du hast 6 + 10 − 4 gerechnet. Bei gleichen Verhältnissen wird multipliziert und geteilt, nicht addiert.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Für welches x gilt x : 6 = 10 : 4? Antwort: x = 15, denn x = 10 · 6 : 4 = 15. Beide Seiten mit 6 multiplizieren.
      - type: text
        text: |
          Warst du unsicher oder war deine Antwort falsch? Dann schau dir den Baustein „Lineare Gleichungen“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/lineare-gleichungen/) an.
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - erkennen und begründen kannst, dass Figuren deckungsgleich sind, und die Kongruenzsätze für Dreiecke anwenden kannst (Kongruenz),
          - Winkel misst und den dritten Winkel im Dreieck aus 180° berechnest,
          - proportionale Zuordnungen erkennst und mit dem Proportionalitätsfaktor rechnest,
          - mit Maßstäben rechnest und Zeichnungen im passenden Maßstab liest,
          - lineare Gleichungen lösen kannst, auch wenn sie als gleiche Verhältnisse dastehen.

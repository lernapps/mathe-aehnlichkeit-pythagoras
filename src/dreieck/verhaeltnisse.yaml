# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Seitenverhältnisse im rechtwinkligen Dreieck
description: Gleicher Winkel, gleiche Verhältnisse. Daraus entstehen Sinus, Kosinus und Tangens.
competencies: [trigonometrie]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Wenn du die Neigung einer Rampe beschreiben willst, ohne die Rampe zu vermessen, brauchst du Seitenverhältnisse, die nur vom Winkel abhängen. Du lernst, warum in rechtwinkligen Dreiecken mit demselben Winkel die Seitenverhältnisse gleich sind, und wie diese Verhältnisse heißen: Sinus, Kosinus und Tangens.
      - type: text
        text: |
          Die Klasse will die Neigung einer Rampe beschreiben, ohne die Rampe zu vermessen. Mira zeichnet zwei rechtwinklige Dreiecke mit dem Winkel 35° bei A. Das erste hat die Hypotenuse 5 cm und die Gegenkathete 2,87 cm. Das zweite hat die Hypotenuse 10 cm. Wie lang ist dessen Gegenkathete? Das klärst du auf dieser Seite.
  - type: section
    id: idee
    title: Gleicher Winkel, gleiche Verhältnisse
    blocks:
      - type: text
        text: |
          Wenn du Winkel und Seitenlängen verbinden willst, brauchst du Verhältnisse, die nur vom Winkel abhängen. Zwei rechtwinklige Dreiecke mit demselben spitzen Winkel *α* haben zwei gleiche Winkel. Sie sind ähnlich, ihre Seiten wachsen mit demselben Faktor. Dann sind auch die Verhältnisse zweier Seiten in beiden Dreiecken gleich. Sie hängen nur vom Winkel *α* ab.
      - type: text
        text: |
          Dafür brauchst du Namen, die vom Winkel *α* ausgehen. Die **Gegenkathete** liegt *α* gegenüber, die **Ankathete** liegt an *α* an, und die Hypotenuse bleibt die Seite gegenüber dem rechten Winkel.
      - type: definition
        term: Gegenkathete
        explanation: Die Kathete, die dem betrachteten spitzen Winkel gegenüberliegt.
      - type: definition
        term: Ankathete
        explanation: Die Kathete, die an dem betrachteten spitzen Winkel anliegt, neben der Hypotenuse.
      - type: text
        text: |
          Im Bild unten stellst du mit zwei Reglern den Winkel *α* und die Länge der Hypotenuse ein. Die Tabelle zeigt die Gegenkathete und die Ankathete und drei Verhältnisse. Verändere zuerst nur die Hypotenuse und beobachte, welche Zahlen gleich bleiben. Verändere danach den Winkel.
      - type: vue-component
        id: winkel-bild
        component: WinkelRegler
        props: {}
        nojs: |
          Ein rechtwinkliges Dreieck mit dem Winkel α bei A, der Gegenkathete, der Ankathete und der Hypotenuse. Bei α = 30° und der Hypotenuse 4 cm ist die Gegenkathete 2 cm und die Ankathete 3,46 cm. Bei der Hypotenuse 8 cm sind es 4 cm und 6,93 cm.
          Gegenkathete durch Hypotenuse ist in beiden Fällen 0,500, Ankathete durch Hypotenuse 0,866, Gegenkathete durch Ankathete 0,577. Bei α = 60° ist Gegenkathete durch Hypotenuse 0,866 und Ankathete durch Hypotenuse 0,500.
      - type: text
        text: |
          Jedes Verhältnis hat einen Namen. Sie gelten für den Winkel *α* im rechtwinkligen Dreieck.
      - type: definition
        term: Sinus
        explanation: Das Verhältnis von Gegenkathete zu Hypotenuse, $\sin \alpha = \frac{\text{Gegenkathete}}{\text{Hypotenuse}}$.
      - type: definition
        term: Kosinus
        explanation: Das Verhältnis von Ankathete zu Hypotenuse, $\cos \alpha = \frac{\text{Ankathete}}{\text{Hypotenuse}}$.
      - type: definition
        term: Tangens
        explanation: Das Verhältnis von Gegenkathete zu Ankathete, $\tan \alpha = \frac{\text{Gegenkathete}}{\text{Ankathete}}$.
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Die Namen Gegenkathete und Ankathete gehören zu einem Winkel. Wechselst du zum anderen spitzen Winkel, tauschen sie ihre Rolle.
  - type: section
    id: beispiel
    title: Ein Beispiel mit 30°
    blocks:
      - type: example
        title: Die drei Verhältnisse bei 30°
        blocks:
          - type: text
            text: |
              Wenn du die drei Verhältnisse an einem Winkel ausrechnen willst, brauchst du nur ein Dreieck mit diesem Winkel. Ein Dreieck hat den Winkel $\alpha = 30^\circ$ und die Hypotenuse 8 cm. Die Gegenkathete ist 4 cm, die Ankathete etwa 6,93 cm.
          - type: formula
            formula: '\sin 30^\circ = \frac{4}{8} = 0{,}5'
          - type: formula
            formula: '\cos 30^\circ = \frac{6{,}93}{8} \approx 0{,}866'
          - type: formula
            formula: '\tan 30^\circ = \frac{4}{6{,}93} \approx 0{,}577'
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: gegenkathete-von-alpha
        text: Das Dreieck ABC hat bei C den rechten Winkel. Welche Seite ist die Gegenkathete von α?
        material:
          - type: figure
            image: images/dreieck-seiten.svg
            alt: Rechtwinkliges Dreieck ABC mit dem rechten Winkel bei C, dem Winkel α bei A und β bei B. Die Seite a liegt gegenüber von A, b gegenüber von B, c gegenüber von C.
            caption: Das Dreieck ABC mit den Seiten a, b und c.
            source: eigene Zeichnung
            licence: CC0-1.0
        options:
          - text: die Seite a
            correct: true
            info: Die Seite a liegt gegenüber von A, also gegenüber von α.
          - text: die Seite b
            correct: false
            info: Die Seite b liegt am Winkel α an, sie ist die Ankathete von α.
          - text: die Seite c
            correct: false
            info: Die Seite c liegt dem rechten Winkel gegenüber, sie ist die Hypotenuse.
        explanation: Die Gegenkathete liegt dem Winkel gegenüber, hier ist es a.
      - type: single-choice
        id: kathete-von-beta
        text: Dasselbe Dreieck ABC. Welche Seite ist die Gegenkathete des Winkels β bei B?
        material:
          - type: figure
            image: images/dreieck-seiten.svg
            alt: Rechtwinkliges Dreieck ABC mit dem rechten Winkel bei C, dem Winkel α bei A und β bei B. Die Seite a liegt gegenüber von A, b gegenüber von B, c gegenüber von C.
            caption: Dasselbe Dreieck ABC.
            source: eigene Zeichnung
            licence: CC0-1.0
        options:
          - text: die Seite a
            correct: false
            info: Das ist die Gegenkathete von α. Für β tauschen die Katheten ihre Rolle.
          - text: die Seite b
            correct: true
            info: Die Seite b liegt gegenüber von B, also gegenüber von β. Für β ist a die Ankathete.
          - text: die Seite c
            correct: false
            info: Die Seite c ist immer die Hypotenuse, egal von welchem Winkel du ausgehst.
        explanation: Für β liegt b gegenüber, a liegt an.
      - type: generated
        id: sinus-verhaeltnis
        given:
          g: { int: [4, 9] }
          h: { int: [10, 13] }
        task:
          text: "In einem rechtwinkligen Dreieck ist die Gegenkathete von α {{g}} cm und die Hypotenuse {{h}} cm lang. Wie groß ist sin α? Runde auf drei Stellen nach dem Komma."
        answer: { value: "round(g / h, 3)", compare: { number: { format: decimal, decimals: 3, tolerance: 0.0005 } } }
        mistakes:
          - {
              value: "round(h / g, 3)",
              message: "Du hast den Kehrwert gebildet. Der Sinus ist Gegenkathete durch Hypotenuse, und die Hypotenuse ist die längste Seite, also ist der Sinus kleiner als 1.",
            }
          - {
              value: "round(g / sqrt(h * h - g * g), 3)",
              message: "Du hast durch die Ankathete geteilt, das ist der Tangens. Der Sinus teilt durch die Hypotenuse.",
            }
        hint: "Sinus ist Gegenkathete durch Hypotenuse."
        steps:
          - '$\sin \alpha = \frac{{{g}}}{{{h}}} \approx {{answer}}$'
      - type: generated
        id: tangens-verhaeltnis
        given:
          g: { int: [2, 9] }
          k: { int: [3, 12] }
        where: ["g != k"]
        task:
          text: "In einem rechtwinkligen Dreieck ist die Gegenkathete von α {{g}} cm und die Ankathete {{k}} cm lang. Wie groß ist tan α? Runde auf drei Stellen nach dem Komma."
        answer: { value: "round(g / k, 3)", compare: { number: { format: decimal, decimals: 3, tolerance: 0.0005 } } }
        mistakes:
          - {
              value: "round(k / g, 3)",
              message: "Du hast den Kehrwert gebildet. Der Tangens ist Gegenkathete durch Ankathete.",
            }
          - {
              value: "round(g / sqrt(g * g + k * k), 3)",
              message: "Du hast durch die Hypotenuse geteilt, das ist der Sinus. Der Tangens teilt durch die Ankathete.",
            }
        hint: "Tangens ist Gegenkathete durch Ankathete."
        steps:
          - '$\tan \alpha = \frac{{{g}}}{{{k}}} \approx {{answer}}$'
      - type: generated
        id: gleicher-winkel
        given:
          g1: { int: [2, 9] }
          h1: { int: [4, 12] }
          h2: { int: [8, 30] }
        where:
          [
            "g1 < h1",
            "h2 > h1",
            "decimals(g1 * h2 / h1) <= 1",
            "g1 + h2 - h1 != g1 * h2 / h1",
            "g1 * h1 / h2 != g1 * h2 / h1",
          ]
        task:
          text: "Zwei rechtwinklige Dreiecke haben denselben Winkel α. Im ersten sind die Gegenkathete {{g1}} cm und die Hypotenuse {{h1}} cm lang. Im zweiten ist die Hypotenuse {{h2}} cm lang. Wie lang ist dort die Gegenkathete?"
        answer: { value: "g1 * h2 / h1", compare: { number: { format: decimal, decimals: 1, unit: cm } } }
        mistakes:
          - {
              value: "g1 + h2 - h1",
              message: "Du hast den Unterschied der Hypotenusen zur Gegenkathete addiert. Bei gleichem Winkel bleibt das Verhältnis gleich, du rechnest mit einem Faktor.",
            }
          - {
              value: "g1 * h1 / h2",
              message: "Du hast den Faktor umgedreht. Das zweite Dreieck ist größer, also ist auch die Gegenkathete länger.",
            }
        hint: "Der Sinus ist in beiden Dreiecken gleich: Gegenkathete durch Hypotenuse. Stelle eine Gleichung auf."
        steps:
          - '$\frac{g_2}{{{h2}}} = \frac{{{g1}}}{{{h1}}}$, also $g_2 = \frac{{{g1}} \cdot {{h2}}}{{{h1}}} = {{answer}}$ cm.'
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: |
          Das kannst du jetzt: Gegenkathete, Ankathete und Hypotenuse vom Winkel aus benennen und Sinus, Kosinus und Tangens als Seitenverhältnisse bestimmen. Auf der nächsten Seite berechnest du mit dem Taschenrechner fehlende Seiten.

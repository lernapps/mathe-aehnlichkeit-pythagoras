# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für dieses Kapitel
description: Quadratwurzeln sowie Fläche und Umfang von Quadrat und Rechteck kurz wiederholt, mit Kurztest.
recap:
  - mathematik/quadratwurzeln
  - mathematik/flaeche-umfang-quadrat-rechteck
blocks:
  - type: text
    text: |
      Für den Satz des Pythagoras brauchst du Quadratwurzeln und die Fläche von Quadrat und Rechteck. Dazu gehören ein paar Begriffe, die hier kurz erklärt werden. Mach nach jedem Abschnitt den Kurztest. Er zählt nichts und speichert nichts.
  - type: section
    id: quadratwurzeln
    title: Quadratwurzeln
    blocks:
      - type: text
        text: |
          Eine **Quadratzahl** entsteht, wenn du eine Zahl mit sich selbst multiplizierst: $7 \cdot 7 = 49$. Die **Quadratwurzel** kehrt das um. Sie fragt, welche nicht negative Zahl mit sich selbst mal genommen die gegebene ergibt.
      - type: definition
        term: Quadratwurzel
        explanation: Die Quadratwurzel $\sqrt{a}$ einer Zahl $a \ge 0$ ist die nicht negative Zahl, deren Quadrat $a$ ergibt. Zum Beispiel ist $\sqrt{49} = 7$, denn $7 \cdot 7 = 49$.
      - type: example
        title: Näherungswert bestimmen
        blocks:
          - type: text
            text: |
              Wie groß ist $\sqrt{20}$? Es ist $4 \cdot 4 = 16$ und $5 \cdot 5 = 25$, also liegt die Wurzel zwischen 4 und 5. Mit $4{,}5 \cdot 4{,}5 = 20{,}25$ ist sie etwas kleiner als 4,5. Der Taschenrechner zeigt $\sqrt{20} \approx 4{,}47$.
      - type: vue-component
        id: test-wurzel
        component: Kurztest
        props:
          question: Zwischen welchen zwei ganzen Zahlen liegt die Wurzel aus 75?
          options:
            - {
                text: "zwischen 7 und 8",
                correct: false,
                info: "7 · 7 = 49 und 8 · 8 = 64. Beide Quadrate sind kleiner als 75, also ist die Wurzel größer als 8.",
              }
            - {
                text: "zwischen 8 und 9",
                correct: true,
                info: "8 · 8 = 64 und 9 · 9 = 81. Die Zahl 75 liegt dazwischen, also auch ihre Wurzel.",
              }
            - {
                text: "zwischen 37 und 38",
                correct: false,
                info: "Du hast 75 halbiert. Eine Wurzel ist keine Hälfte: Gesucht ist die Zahl, die mit sich selbst mal genommen 75 ergibt.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Zwischen welchen zwei ganzen Zahlen liegt die Wurzel aus 75? Antwort: zwischen 8 und 9, denn 8 · 8 = 64 und 9 · 9 = 81, und 75 liegt dazwischen.
      - type: vue-component
        id: test-wurzel-summe
        component: Kurztest
        props:
          question: Wie groß ist die Wurzel aus der Summe 9 + 16?
          options:
            - text: "7"
              correct: false
              info: Du hast die Wurzeln einzeln gezogen, 3 + 4. Die Wurzel aus einer Summe ist aber nicht die Summe der Wurzeln.
            - text: "25"
              correct: false
              info: Das ist die Summe 9 + 16. Die Wurzel daraus musst du noch ziehen.
            - text: "5"
              correct: true
              info: "Erst addieren: 9 + 16 = 25, dann die Wurzel: 5."
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie groß ist die Wurzel aus 9 + 16? Antwort: 5, denn 9 + 16 = 25 und die Wurzel aus 25 ist 5. Die Wurzeln einzeln zu ziehen (3 + 4 = 7) ist falsch.
      - type: vue-component
        id: test-wurzel-quadrat
        component: Kurztest
        props:
          question: Ein quadratisches Beet hat eine Fläche von 81 m². Wie lang ist eine Seite?
          options:
            - {
                text: "9 m",
                correct: true,
                info: "Die Fläche ist Seite mal Seite. 9 · 9 = 81, also ist die Seite die Wurzel aus 81, nämlich 9 m.",
              }
            - {
                text: "40,5 m",
                correct: false,
                info: "Du hast 81 halbiert. Seite mal Seite soll 81 ergeben, nicht Seite mal 2.",
              }
            - {
                text: "9 m²",
                correct: false,
                info: "Die Zahl stimmt, aber eine Seitenlänge hat die Einheit m, nicht m².",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein quadratisches Beet hat eine Fläche von 81 m². Wie lang ist eine Seite? Antwort: 9 m, denn 9 · 9 = 81. Die Seite ist die Wurzel aus der Fläche. Die Einheit ist m, nicht m².
      - type: text
        text: |
          Warst du unsicher oder war deine Antwort falsch? Dann schau dir den Baustein „Quadratwurzeln“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/quadratwurzeln/) an.
  - type: section
    id: flaeche
    title: "Fläche und Umfang: Rechteck, Quadrat"
    blocks:
      - type: text
        text: |
          Der **Flächeninhalt** sagt, wie viel Platz eine Figur einnimmt, in Quadrateinheiten wie cm². Der **Umfang** ist die Länge des Randes, in cm. Beim Rechteck mit den Seiten $a$ und $b$ ist $A = a \cdot b$ und $u = 2 \cdot (a + b)$. Beim Quadrat mit der Seite $a$ ist $A = a \cdot a$ und $u = 4 \cdot a$.
      - type: definition
        term: Flächeninhalt
        explanation: Das Maß dafür, wie viele Einheitsquadrate in eine Figur passen. Ein Rechteck mit 3 cm und 2 cm hat 6 cm², weil 6 Quadrate von 1 cm Seitenlänge hineinpassen.
      - type: example
        title: Ein Quadrat über einer Strecke
        blocks:
          - type: text
            text: |
              Über einer Strecke von 4 cm Länge kannst du ein Quadrat zeichnen. Seine Fläche ist $4 \cdot 4 = 16$ cm², sein Umfang $4 \cdot 4 = 16$ cm. Zahl gleich, Einheit verschieden. Diese Quadrate über Seiten brauchst du gleich für Pythagoras.
      - type: vue-component
        id: test-flaeche
        component: Kurztest
        props:
          question: Ein Quadrat hat den Umfang 20 cm. Wie groß ist seine Fläche?
          options:
            - {
                text: "400 cm²",
                correct: false,
                info: "Du hast den Umfang selbst mal sich selbst genommen. Erst die Seitenlänge bestimmen: 20 cm : 4 = 5 cm.",
              }
            - {
                text: "25 cm²",
                correct: true,
                info: "Eine Seite ist 20 cm : 4 = 5 cm, die Fläche 5 cm · 5 cm = 25 cm².",
              }
            - {
                text: "5 cm²",
                correct: false,
                info: "5 cm ist die Seitenlänge. Die Fläche ist Seite mal Seite, also 25 cm².",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Quadrat hat den Umfang 20 cm. Wie groß ist seine Fläche? Antwort: 25 cm². Eine Seite ist 20 cm : 4 = 5 cm, die Fläche ist 5 cm · 5 cm = 25 cm².
      - type: vue-component
        id: test-rechteck
        component: Kurztest
        props:
          question: Ein Rechteck ist 7 cm lang und 4,5 cm breit. Wie groß ist sein Umfang?
          options:
            - {
                text: "31,5 cm",
                correct: false,
                info: "7 · 4,5 = 31,5 ist die Fläche, in cm². Der Umfang ist die Summe aller vier Seiten.",
              }
            - {
                text: "11,5 cm",
                correct: false,
                info: "Du hast nur zwei Seiten addiert. Ein Rechteck hat vier Seiten, also noch mal 2.",
              }
            - { text: "23 cm", correct: true, info: "Umfang = 2 · (7 cm + 4,5 cm) = 2 · 11,5 cm = 23 cm." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Rechteck ist 7 cm lang und 4,5 cm breit. Wie groß ist sein Umfang? Antwort: 23 cm, denn 2 · (7 + 4,5) = 23. Die Fläche wäre 31,5 cm².
      - type: vue-component
        id: test-rechteck-seite
        component: Kurztest
        props:
          question: Ein Rechteck hat die Fläche 54 cm² und ist 9 cm lang. Wie breit ist es?
          options:
            - text: 6 cm
              correct: true
              info: "Fläche = Länge mal Breite, also Breite = 54 cm² : 9 cm = 6 cm."
            - text: 45 cm
              correct: false
              info: Du hast subtrahiert, 54 − 9. Die Fläche ist ein Produkt, also wird geteilt.
            - text: 486 cm
              correct: false
              info: Du hast multipliziert, 54 · 9. Gesucht ist ein Faktor des Produkts, also wird geteilt.
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Rechteck hat die Fläche 54 cm² und ist 9 cm lang. Wie breit ist es? Antwort: 6 cm, denn Breite = 54 cm² : 9 cm = 6 cm.
      - type: text
        text: |
          Warst du unsicher oder war deine Antwort falsch? Dann schau dir den Baustein „Fläche und Umfang: Rechteck, Quadrat“ auf der [Lernlandkarte](https://lernapps.net/apps/map/mathematik/c/flaeche-umfang-quadrat-rechteck/) an.
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - Quadratwurzeln erklären und Näherungswerte bestimmen kannst (Quadratwurzeln),
          - Flächeninhalt und Umfang von Quadrat und Rechteck berechnen kannst (Fläche und Umfang: Rechteck, Quadrat).
